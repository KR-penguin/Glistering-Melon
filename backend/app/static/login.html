<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · Glistering Melon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/static/ds.css">
<style>
  body { margin: 0; word-break: keep-all; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px) 64px; }
  .kr-h { font-weight: 900; letter-spacing: -0.03em; }
  .panel { border: 2px solid var(--color-divider); padding: clamp(16px, 3vw, 24px); margin-top: 24px; }
  .hint { font-size: 12.5px; line-height: 20px; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
  .err { color: var(--color-accent-800); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--color-divider); align-items: center; }
  .row:last-child { border-bottom: 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
  .on { background: #1f9d55; } .off { background: var(--color-neutral-500); } .warn { background: var(--color-accent); }
</style>
</head>
<body>

<nav class="nav" style="padding-inline: max(16px, calc((100% - 560px) / 2 + 16px));">
  <span class="nav-brand kr-h">GLISTERING MELON</span>
</nav>

<div class="wrap">

  <section id="loginpanel" class="panel">
    <h1 class="kr-h" style="font-size: 26px; margin: 0 0 6px;">로그인</h1>
    <p class="hint" style="margin: 0 0 18px;">계정으로 로그인하면 어느 기기에서든 내 서버를 관리할 수 있어요.</p>
    <form id="form" style="display: grid; gap: 12px;">
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" class="input" type="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input id="pw" class="input" type="password" required autocomplete="current-password">
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button type="submit" class="btn btn-primary" id="btn">로그인</button>
        <span class="hint" id="msg"></span>
      </div>
    </form>
  </section>

  <section id="mypanel" class="panel" hidden>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
      <h1 class="kr-h" style="font-size: 22px; margin: 0;">내 서버</h1>
      <button type="button" class="btn btn-secondary" id="logout">로그아웃</button>
    </div>
    <p class="hint" id="whoami" style="margin: 6px 0 16px;"></p>
    <div id="servers"></div>
  </section>

</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const TIER = { small: '소규모', friends: '친구들', community: '커뮤니티' };

  function token() {
    try { return localStorage.getItem('gm_auth_token') || ''; } catch (e) { return ''; }
  }

  function renderServers(d) {
    $('whoami').textContent = d.email;
    $('servers').innerHTML = '';
    if (!d.servers.length) {
      $('servers').innerHTML = '<p class="hint">아직 연결된 서버가 없어요.</p>';
      return;
    }
    d.servers.forEach(function (s) {
      const running = s.status === 'running';
      const cls = running ? 'on' : (s.status === 'suspended' ? 'warn' : 'off');
      const row = document.createElement('div');
      row.className = 'row';
      const left = document.createElement('div');
      left.innerHTML = '<span class="dot ' + cls + '"></span><strong>' + s.nickname + '</strong> ' +
        '<span class="hint">' + (TIER[s.tier] || s.tier) + ' · ' + s.status +
        (s.payment_status === 'paid' ? '' : ' · 입금 대기') + '</span>';
      const link = document.createElement('a');
      link.className = 'btn btn-primary';
      link.href = '/session/' + s.session_token;
      link.textContent = '관리하기';
      row.append(left, link);
      $('servers').append(row);
    });
  }

  async function loadMe() {
    if (!token()) return false;
    const r = await fetch('/api/auth/me', { headers: { 'X-Auth-Token': token() } });
    if (!r.ok) { try { localStorage.removeItem('gm_auth_token'); } catch (e) {} return false; }
    renderServers(await r.json());
    $('loginpanel').hidden = true;
    $('mypanel').hidden = false;
    return true;
  }

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('btn').disabled = true;
    $('msg').className = 'hint';
    $('msg').textContent = '확인 중…';
    try {
      // If the visitor arrived from a session they were already using,
      // claim that server on login too.
      let sessionToken = null;
      try { sessionToken = localStorage.getItem('gm_session_token'); } catch (err) {}
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('email').value.trim(), password: $('pw').value, session_token: sessionToken })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || '로그인에 실패했어요.');
      try { localStorage.setItem('gm_auth_token', d.token); } catch (err) {}
      $('msg').textContent = '';
      await loadMe();
    } catch (err) {
      $('msg').className = 'hint err';
      $('msg').textContent = err.message;
    } finally {
      $('btn').disabled = false;
    }
  });

  $('logout').addEventListener('click', async function () {
    await fetch('/api/auth/logout', { method: 'POST', headers: { 'X-Auth-Token': token() } });
    try { localStorage.removeItem('gm_auth_token'); } catch (e) {}
    location.reload();
  });

  loadMe();
})();
</script>
</body>
</html>
