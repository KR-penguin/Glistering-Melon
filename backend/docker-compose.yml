services:
  backend:
    build: .
    container_name: gm-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the SAME path inside and outside the container on purpose.
      # This backend asks the HOST's Docker daemon to bind-mount world dirs
      # into each Minecraft container, and the daemon resolves those paths
      # against the HOST filesystem — so a path that only existed inside this
      # container would silently put world data somewhere else entirely.
      - ${HOST_DATA_ROOT}:${HOST_DATA_ROOT}
    environment:
      - DATA_ROOT=${HOST_DATA_ROOT}
    networks:
      - gm-net

  # Local model server, so agent calls cost nothing.
  #
  # llama.cpp rather than Ollama, for two reasons that matter here:
  #  - it exposes GBNF / JSON-schema constrained decoding, which is the path
  #    to making an invalid tool name literally ungenerable rather than merely
  #    unlikely on a small model,
  #  - it gives exact control over layer offload and context on a 4GB card,
  #    where Ollama's scheduler silently falls back to CPU and quietly
  #    degrades tool-call accuracy while still looking healthy.
  #
  # CPU-only as configured (-ngl 0). The box has a GTX 1050 Ti but no driver;
  # switching to GPU is image + two flags, no application changes.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gm-llm
    restart: unless-stopped
    volumes:
      - llm-models:/models
    environment:
      - LLAMA_CACHE=/models
    command:
      - "-hf"
      - "unsloth/Qwen3.5-4B-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      # -ngl 0 = CPU only. Set to "all" once the NVIDIA driver is installed.
      - "-ngl"
      - "0"
      - "-c"
      - "8192"
      # Leave one core for the OS, the backend, and the Minecraft servers.
      - "-t"
      - "5"
      - "-np"
      - "1"
      # KV cache stays f16: llama.cpp's own docs warn that quantizing it
      # substantially degrades tool-calling accuracy.
      - "-ctk"
      - "f16"
      - "-ctv"
      - "f16"
      - "--cache-prompt"
      - "--cache-reuse"
      - "256"
      - "--jinja"
      # Nearly every 2026 llama.cpp Qwen3.5 tool-call bug is reasoning output
      # leaking into the tool-call stream. Off also saves hundreds of tokens
      # per turn, which on CPU is tens of seconds.
      - "--reasoning-budget"
      - "0"
      - "--chat-template-kwargs"
      - '{"enable_thinking":false}'
    # Hard ceilings so inference can never starve the live hosting service.
    mem_limit: 5g
    cpus: 5.0
    networks:
      - gm-net
    # Deliberately NOT published to the host: only the backend needs it, and an
    # open inference endpoint on the LAN is free compute for anyone on it.
    expose:
      - "8080"

volumes:
  llm-models:

networks:
  gm-net:
    name: gm-net
