services:
  backend:
    build: .
    container_name: gm-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the SAME path inside and outside the container on purpose.
      # This backend asks the HOST's Docker daemon to bind-mount world dirs
      # into each Minecraft container, and the daemon resolves those paths
      # against the HOST filesystem — so a path that only existed inside this
      # container would silently put world data somewhere else entirely.
      - ${HOST_DATA_ROOT}:${HOST_DATA_ROOT}
      # World data, on its own disk. Same identical-path rule applies.
      - ${HOST_WORLDS_ROOT}:${HOST_WORLDS_ROOT}
    environment:
      - DATA_ROOT=${HOST_DATA_ROOT}
      - WORLDS_ROOT_OVERRIDE=${HOST_WORLDS_ROOT}
      # The Vertex service-account key, which lives inside HOST_DATA_ROOT so it
      # rides the mount above rather than needing one of its own. A bind mount
      # for a single file is a trap here: if the source does not exist yet,
      # Docker creates a DIRECTORY at that path and authentication then fails
      # against a directory. Sitting inside an already-mounted tree, a missing
      # file is just a missing file, and the error says so.
      #
      # It is outside the repository, so it cannot be committed, and the
      # Dockerfile never COPYs it, so it cannot leak through an image layer.
      # Vertex has no API-key alternative — this file IS the credential.
      - GOOGLE_APPLICATION_CREDENTIALS=${HOST_DATA_ROOT}/gcp-credentials.json
    networks:
      - gm-net

networks:
  gm-net:
    name: gm-net
