services:
  backend:
    build: .
    container_name: gm-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/srv/data
    environment:
      - DATA_ROOT=/srv/data
    networks:
      - gm-net

networks:
  gm-net:
    name: gm-net
